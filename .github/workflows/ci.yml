name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The checks run against the stored reading alone. Nothing here reads the storefront
# and nothing here calls a model.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
